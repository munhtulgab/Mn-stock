name: App cron

# Manual runs of the scheduled endpoints. The schedule itself lives on
# cron-job.org, not here.
#
# This workflow used to carry the schedule. Two things moved it:
#
#   Granularity. The price tick is wanted every two minutes through the
#   trading window, and GitHub's shortest scheduled interval is five: "The
#   shortest interval you can run scheduled workflows is once every 5
#   minutes." A */2 trigger here would simply not fire at that rate.
#
#   Cost. The weekday 12:45 news run is the one call that spends Apify
#   credits, and it takes fresh posts rather than reading the cache, so it
#   cannot be made idempotent. Two schedulers both firing it means two
#   scrapes a day and twice the bill against an allowance that has run out
#   mid-month before.
#
# Reliability pushed the same way: every run of this workflow has failed with
# "The job was not started because your account is locked due to a billing
# issue" — no runner, no log, a few seconds each. A schedule that cannot run
# is worse than no schedule, because it looks like one.
#
# So the schedule is on cron-job.org and this is what remains: a way to run
# any one of the endpoints by hand. See the README's Хуваарь section for the
# jobs and their times.
#
# Requires an APP_CRON_SECRET repo secret matching the CRON_SECRET
# environment variable set on the Vercel project.
on:
  workflow_dispatch:
    inputs:
      job:
        description: Which endpoint to call
        required: true
        default: tick
        type: choice
        options:
          - tick
          # Every source except Facebook. Free to run as often as you like.
          - news
          # News including a fresh Facebook scrape. Spends Apify credits.
          - news-facebook
          - sync

env:
  BASE_URL: https://mn-stock.vercel.app
  AUTH: Bearer ${{ secrets.APP_CRON_SECRET }}

jobs:
  cron:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Call the endpoint
        run: |
          set -uo pipefail

          if [ -z "${APP_CRON_SECRET:-}" ]; then
            echo "::error::APP_CRON_SECRET is not set. Add it under Settings →"
            echo "Secrets and variables → Actions with the same value as"
            echo "CRON_SECRET in the Vercel project."
            exit 1
          fi

          case "${MANUAL:-tick}" in
            tick)          path="/api/prices/tick";                budget=120 ;;
            news)          path="/api/news/refresh?facebook=skip"; budget=300 ;;
            news-facebook) path="/api/news/refresh";               budget=300 ;;
            # The sync walks every listing for prices and financial reports
            # and the route allows itself five minutes, so the caller has to
            # be at least as patient.
            sync)          path="/api/sync?maxMs=250000";          budget=600 ;;
          esac

          echo "→ ${MANUAL:-tick}  ${BASE_URL}${path}"
          status=$(curl -s -o /tmp/body -w "%{http_code}" --max-time "$budget" \
            -X POST "${BASE_URL}${path}" -H "Authorization: $AUTH")

          echo "HTTP $status"
          # The sync's reply names every symbol it touched, which is far too
          # long for a log line but worth seeing the start of.
          head -c 600 /tmp/body; echo

          # The way this breaks quietly is the two secrets drifting apart.
          if [ "$status" = "401" ]; then
            echo "::error::Rejected. APP_CRON_SECRET does not match CRON_SECRET in Vercel."
            exit 1
          fi
          [ "$status" -ge 200 ] && [ "$status" -lt 300 ]
        env:
          APP_CRON_SECRET: ${{ secrets.APP_CRON_SECRET }}
          MANUAL: ${{ inputs.job }}
